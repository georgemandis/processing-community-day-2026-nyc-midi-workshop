<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LED Lab</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; padding: 1.5rem; font-family: system-ui, sans-serif; background: #14161a; color: #e8e8e8; }
    h1 { margin: 0 0 .25rem; font-size: 1.5rem; }
    .muted { color: #9aa0a6; }
    button, select, input[type=text] { font: inherit; padding: .45rem .8rem; border-radius: .5rem; border: 1px solid #444; background: #22252b; color: inherit; }
    button { cursor: pointer; }
    button.primary { background: #3d7bff; border-color: #3d7bff; color: white; }
    .actions { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; margin: .5rem 0; }
    .panel { background: #1b1e24; border: 1px solid #333; border-radius: .75rem; padding: 1rem; margin-bottom: 1rem; }
    .panel h2 { margin: 0 0 .6rem; font-size: .95rem; text-transform: uppercase; letter-spacing: .08em; color: #9aa0a6; }
    .grid { display: inline-grid; gap: 4px; }
    .cell { width: 38px; height: 38px; border-radius: 6px; background: #2a2d33; border: 1px solid #3a3d44; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: .6rem; font-family: ui-monospace, monospace; color: #7d838a; }
    .cell.round { border-radius: 50%; }
    .cell.blank { visibility: hidden; }
    .cell.pressed { outline: 2px solid #fff; }
    .swatches { display: flex; flex-wrap: wrap; gap: 3px; max-width: 34rem; }
    .swatch { width: 22px; height: 22px; border-radius: 4px; border: 2px solid transparent; cursor: pointer; }
    .swatch.sel { border-color: #fff; }
    label { display: inline-flex; gap: .4rem; align-items: center; }
  </style>
</head>
<body>
  <h1>LED Lab</h1>
  <div class="muted" id="status">Connecting…</div>

  <div class="panel" id="lp-panel" hidden>
    <h2>Launchpad Mini MK3</h2>
    <div class="actions">
      <span>paint with:</span>
      <div class="swatches" id="lp-swatches"></div>
      <select id="lp-mode"><option value="static">static</option><option value="flash">flash</option><option value="pulse">pulse</option></select>
      <label><input type="checkbox" id="lp-echo" checked> echo presses</label>
    </div>
    <div class="actions">
      <input type="color" id="lp-rgb" value="#ff4080"><span class="muted">RGB via SysEx: pick, then click a pad</span>
      <label><input type="radio" name="lp-paint" value="palette" checked> palette</label>
      <label><input type="radio" name="lp-paint" value="rgb"> rgb</label>
    </div>
    <div class="grid" id="lp-grid" style="grid-template-columns: repeat(9, 38px)"></div>
    <div class="actions">
      <button id="lp-clear">Clear</button>
      <button id="lp-rainbow">Rainbow</button>
      <button id="lp-sweep">Sweep</button>
      <button id="lp-stop">Stop animation</button>
      <input type="text" id="lp-text" placeholder="scroll some text" size="18">
      <button id="lp-text-go">Scroll</button>
    </div>
  </div>

  <div class="panel" id="mf-panel" hidden>
    <h2>Midi Fighter Classic <span class="muted" id="mf-mode"></span></h2>
    <div class="actions">
      <label><input type="checkbox" id="mf-echo" checked> echo presses</label>
      <label>mode <select id="mf-mode-sel"><option value="default">default (16 notes)</option><option value="internal">four banks internal</option></select></label>
      <label>bank <select id="mf-bank-sel"><option>1</option><option>2</option><option>3</option><option>4</option></select></label>
      <span class="muted">Set these to match the unit, or press its top row and it self-detects.</span>
    </div>
    <div class="grid" id="mf-grid" style="grid-template-columns: repeat(4, 38px)"></div>
    <div class="actions">
      <button id="mf-all">All on</button>
      <button id="mf-clear">Clear</button>
      <button id="mf-chase">Chase</button>
      <button id="mf-stop">Stop animation</button>
    </div>
  </div>

  <script type="module">
    import { Launchpad, COLORS, xyToNote } from "./launchpad.js";
    import { MidiFighter } from "./midifighter.js";

    const $ = (id) => document.getElementById(id);
    const el = (tag, cls) => { const e = document.createElement(tag); if (cls) e.className = cls; return e; };
    let midi;
    try { midi = await navigator.requestMIDIAccess({ sysex: true }); }
    catch (e) { $("status").textContent = `MIDI access failed: ${e.message}`; }

    const found = [];
    // Rough on-screen approximations of the Launchpad palette entries we expose as swatches.
    const SWATCH = { off: "#111", white: "#eee", red: "#f33", orange: "#f83", yellow: "#fe3", lime: "#9f3", green: "#3f3", mint: "#3fa", cyan: "#3ff", sky: "#3af", blue: "#33f", violet: "#93f", magenta: "#f3f", pink: "#f6a" };

    // ---------------------------------------------------------------- Launchpad
    let pad = null, lpColor = COLORS.red, lpTimer = null;
    const lpState = new Map(); // note/cc -> css colour
    try {
      pad = await Launchpad.connect({ midiAccess: midi });
      found.push("Launchpad");
      $("lp-panel").hidden = false;
      for (const [name, idx] of Object.entries(COLORS)) {
        const s = el("div", "swatch" + (idx === lpColor ? " sel" : "")); s.style.background = SWATCH[name]; s.title = `${name} (${idx})`;
        s.addEventListener("click", () => { lpColor = idx; document.querySelectorAll(".swatch").forEach((x) => x.classList.remove("sel")); s.classList.add("sel"); $("lp-paint-palette")?.click(); });
        $("lp-swatches").append(s);
      }
      const cells = {};
      const paintCell = (key, css) => { cells[key].style.background = css; cells[key].style.color = css === "#2a2d33" ? "#7d838a" : "#111"; };
      const hexToRGB127 = (hex) => [1, 3, 5].map((i) => Math.round(parseInt(hex.slice(i, i + 2), 16) / 2));
      const paintMode = () => document.querySelector("input[name=lp-paint]:checked").value;
      for (let y = 0; y < 9; y++) {
        for (let x = 0; x < 9; x++) {
          const isTop = y === 0, isRight = x === 8;
          const c = el("div", "cell" + (isTop || isRight ? " round" : ""));
          let key, target;
          if (isTop && isRight) { key = "logo"; target = { id: "logo" }; }
          else if (isTop) { key = `top${x}`; target = { id: key }; }
          else if (isRight) { key = `right${y - 1}`; target = { id: key }; }
          else { key = `pad${x},${y - 1}`; target = { x, y: y - 1 }; }
          c.textContent = target.id ? (target.id === "logo" ? "◆" : target.id.replace(/\D/g, "")) : xyToNote(x, y - 1);
          c.title = key;
          c.addEventListener("click", () => {
            const mode = $("lp-mode").value;
            if (paintMode() === "rgb") {
              const rgb = hexToRGB127($("lp-rgb").value);
              pad.setMany([{ ...target, rgb }]);
              paintCell(key, $("lp-rgb").value);
            } else {
              const swatchName = Object.keys(COLORS).find((k) => COLORS[k] === lpColor);
              if (target.id) pad.button(target.id, lpColor, { mode }); else pad.set(target.x, target.y, lpColor, { mode });
              paintCell(key, lpColor === 0 ? "#2a2d33" : SWATCH[swatchName]);
            }
          });
          cells[key] = c;
          $("lp-grid").append(c);
        }
      }
      pad.on("pad", ({ x, y, pressed }) => {
        const c = cells[`pad${x},${y}`]; c.classList.toggle("pressed", pressed);
        if ($("lp-echo").checked) { pad.set(x, y, pressed ? COLORS.white : 0); paintCell(`pad${x},${y}`, pressed ? "#eee" : "#2a2d33"); }
      });
      pad.on("button", ({ id, pressed }) => { cells[id]?.classList.toggle("pressed", pressed); });
      const stopAnim = () => { clearInterval(lpTimer); lpTimer = null; };
      $("lp-clear").addEventListener("click", () => { stopAnim(); pad.clear(); Object.keys(cells).forEach((k) => paintCell(k, "#2a2d33")); });
      $("lp-rainbow").addEventListener("click", () => {
        stopAnim(); let t = 0;
        lpTimer = setInterval(() => {
          const entries = [];
          for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) {
            const h = ((x + y) / 16 + t / 40) % 1, [r, g, b] = hsl(h);
            entries.push({ x, y, rgb: [r, g, b] }); paintCell(`pad${x},${y}`, `rgb(${r * 2},${g * 2},${b * 2})`);
          }
          pad.setMany(entries); t++;
        }, 60);
      });
      $("lp-sweep").addEventListener("click", () => {
        stopAnim(); let i = 0;
        lpTimer = setInterval(() => {
          const entries = [];
          for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) {
            const on = (x + y * 8) === i % 64; entries.push({ x, y, color: on ? lpColor : 0 });
            paintCell(`pad${x},${y}`, on ? "#fff" : "#2a2d33");
          }
          pad.setMany(entries); i++;
        }, 40);
      });
      $("lp-stop").addEventListener("click", stopAnim);
      $("lp-text-go").addEventListener("click", () => pad.text($("lp-text").value || "hello", { color: lpColor || 3, speed: 7 }));
      window.addEventListener("beforeunload", () => pad.close());
    } catch (e) { console.warn("Launchpad:", e.message); }

    // ---------------------------------------------------------------- Midi Fighter Classic
    let mf = null, mfTimer = null;
    try {
      mf = await MidiFighter.connect({ midiAccess: midi });
      found.push("Midi Fighter Classic");
      $("mf-panel").hidden = false;
      const lit = new Set(), cells = [];
      const paint = () => cells.forEach((c, i) => { c.style.background = lit.has(i) ? "#ffd166" : "#2a2d33"; c.style.color = lit.has(i) ? "#111" : "#7d838a"; });
      const modeText = () => ($("mf-mode").textContent = mf.mode === "internal" ? `four banks internal, bank ${mf.bank} (top row not addressable)` : "default mode");
      for (let i = 0; i < 16; i++) {
        const c = el("div", "cell round"); c.textContent = i + 1;
        c.addEventListener("click", () => { if (lit.has(i)) lit.delete(i); else lit.add(i); mf.led(i, lit.has(i)); paint(); });
        cells.push(c); $("mf-grid").append(c);
      }
      mf.on("button", ({ index, pressed }) => {
        cells[index].classList.toggle("pressed", pressed); modeText();
        if ($("mf-echo").checked && !(mf.mode === "internal" && index < 4)) { if (pressed) lit.add(index); else lit.delete(index); mf.led(index, pressed); paint(); }
      });
      mf.on("bank", () => { $("mf-bank-sel").value = mf.bank; $("mf-mode-sel").value = mf.mode; modeText(); });
      $("mf-mode-sel").addEventListener("change", () => { mf.mode = $("mf-mode-sel").value; modeText(); });
      $("mf-bank-sel").addEventListener("change", () => { mf.bank = +$("mf-bank-sel").value; modeText(); });
      modeText();
      const stop = () => { clearInterval(mfTimer); mfTimer = null; };
      $("mf-all").addEventListener("click", () => { stop(); for (let i = 0; i < 16; i++) lit.add(i); mf.leds([...lit]); paint(); });
      $("mf-clear").addEventListener("click", () => { stop(); lit.clear(); mf.clear(); paint(); });
      $("mf-chase").addEventListener("click", () => {
        stop(); let i = 0;
        mfTimer = setInterval(() => { lit.clear(); lit.add(i % 16); mf.leds([i % 16]); paint(); i++; }, 80);
      });
      $("mf-stop").addEventListener("click", stop);
      window.addEventListener("beforeunload", () => mf.close());
    } catch (e) { console.warn("Midi Fighter:", e.message); }

    $("status").textContent = found.length ? `Connected: ${found.join(", ")}` : "No Launchpad or Midi Fighter found.";

    function hsl(h) { // hue 0..1 → r,g,b 0..127
      const f = (n) => { const k = (n + h * 6) % 6; return Math.round(127 * (1 - Math.max(0, Math.min(k, 4 - k, 1)))); };
      return [f(5), f(3), f(1)];
    }
  </script>
</body>
</html>
