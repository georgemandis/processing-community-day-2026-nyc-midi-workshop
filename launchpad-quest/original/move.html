var midiInput = null,
    midiOutput = null,
    grid = new Array(8);

    for (var x = 0; x < 8; x++) {
      grid[x] = new Array(8);
    }

      // note off
      //noteOff(b);

      if (false)
        tick();
      else {

        var y = (noteNumber & 0xf0) >> 4;
        // flipXY( x, y );
      }
    } else if (cmd == 11) { // Continuous Controller message
      switch (noteNumber) {
      }
    }
    
    var parse = (noteNumber) / 10;
    var y = Math.abs((parseInt(parse.toString().split(".")[0]) - 1)-7);
    var x = parseInt(parse.toString().split(".")[1]) - 1;
    
    // console.log(x,y)

    // var x = noteNumber & 0x0f;
    // var y = (noteNumber & 0xf0) >> 4;
    
    
    var channel = noteNumber;
    // console.log(grid[x][y])
  
    // if ((grid[x][y] === undefined || grid[x][y] === 0)  && data[2] == 127) {
    //   midiOutput.send([144,data[1], 120]);

    //   document.querySelector('.button:nth-of-type('+(x+(y*8)+1)+')').style.background="#f00"
    // }else if (grid[x][y] == 120 && data[2] == 127) {
    //   midiOutput.send([144,data[1], 15]);
    //   grid[x][y] = 15;
    //   document.querySelector('.button:nth-of-type('+(x+(y*8)+1)+')').style.background="#ff0"
    // }else if (grid[x][y] == 15 && data[2] == 127) {
    //   midiOutput.send([144,data[1],0]);
    //   grid[x][y] = 0;
    //   document.querySelector('.button:nth-of-type('+(x+(y*8)+1)+')').style.background="#333"
    // }

      midiOutput.send([144,data[1], 120]);

    }else if (grid[x][y] == 120 && data[2] == 127) {
      midiOutput.send([144,data[1], 0]);

  var onMIDIInit = function(midi){
    // console.log(midi.inputs)
    for (var input of midi.inputs.values()) {
      // console.log(input.name)
      if (input.name === "Launchpad Mini") midiInput = input;
    }

    for (var output of midi.outputs.values()) {
      if (output.name === "Launchpad Mini") midiOutput = output;
    }

    if (midiInput) midiInput.onmidimessage = midiProc;   
  
    resetBoard();
    // generateMaze(.3);
    
    if (midiInput)  {
      midiOutput.send( [0xB0,0x00,0x00] ); // Reset Launchpad
   	  midiOutput.send( [0xB0,0x00,0x01] ); // Select XY mode

     // turn off and then set to flash a color on/off
   	  midiOutput.send( [144, 11, 0] ); // Select XY mode
   	  midiOutput.send( [144, coordinateToMIDINote(0,0), 32] ); // Select XY mode
      
    }
  
     // midiOutput.send( [146, 88, 32] ); // Select XY mode
      document.querySelector('.button:nth-of-type(1)').style.background="#0ff"      
    
     var piece = {
       x:0,
       y:0
     }
    document.addEventListener("keydown", function(e) {
      oldCoords = {
        x: piece.x,
        y: piece.y
      }

   	  if (midiOutput) midiOutput.send( [144, coordinateToMIDINote(piece.x,piece.y), 0] ); // Select XY mode
      grid[piece.x][piece.y] = 0
      
      if (e.key === 'ArrowUp') piece.y--;
      if (e.key === 'ArrowDown') piece.y++;
      if (e.key === 'ArrowLeft') piece.x--;
      if (e.key === 'ArrowRight') piece.x++;
      
      if (piece.x > 7) piece.x = 7;
      if (piece.x < 0) piece.x = 0;
      if (piece.y > 7) piece.y = 7;
      if (piece.y < 0) piece.y = 0;
            
      if (grid[piece.x][piece.y] !== 0 && grid[piece.x][piece.y] !== undefined && grid[piece.x][piece.y] !== 15) {
        console.log(grid[piece.x][piece.y])
        piece.x = oldCoords.x;
        piece.y = oldCoords.y;        
      }else if (grid[piece.x][piece.y] === 15) {
      }
      
      grid[piece.x][piece.y] = 32
      document.querySelector('.button:nth-of-type('+(oldCoords.x+(oldCoords.y*8)+1)+')').style.background="#333"      
      document.querySelector('.button:nth-of-type('+(piece.x+(piece.y*8)+1)+')').style.background="#0ff"      
   	  if (midiOutput) midiOutput.send( [144, coordinateToMIDINote(piece.x,piece.y), 32] ); // Select XY mode      
    })
    

  }
  
  
  function coordinateToMIDINote(x,y) {
    value = 88 - 7 + (x - (y * 10));  
    return value;
  }
  
  function resetBoard() {  
    
    for (var x = 0; x < 8; x++) {
      grid[x] = [0,0,0,0,0,0,0,0]
    }
    
    for (let i =0; i < 127;i++) {
      if (midiOutput) midiOutput.send([144,i,0]); 
    }  
  }
  
  function generateMaze(complexity) {  
    for (let y =0; y < 8;y++) {
      for (let x =0; x < 8;x++) {
        
        if (Math.random() < complexity) {
          grid[x][y] = 120;        
          if (midiOutput) midiOutput.send([144, coordinateToMIDINote(x,y),120]);
        document.querySelector('.button:nth-of-type('+(x+(y*8)+1)+')').style.background="#f00"                
        }else{
          grid[x][y] = 0        
        }
      }  
    }
    
    let treasureX = Math.floor(Math.random()*7);
    let treasureY = Math.floor(Math.random()*7);
    
    grid[treasureX][treasureY] = 15;
    if (midiOutput)  midiOutput.send([144, coordinateToMIDINote(treasureX,treasureY),15]);
    document.querySelector('.button:nth-of-type('+(treasureX+(treasureY*8)+1)+')').style.background="#ff0";
    
  }
  
  
  onMIDIFail= function(){
    console.log("Could not load MIDI");
  }
  
  
  navigator.requestMIDIAccess({}).then( onMIDIInit, onMIDIFail );
  
  
  
  /* Webcam to show Launchpad on screen during presentation
  ========================================================*/
  document.getElementById('watch-board').addEventListener('click', function(){
    navigator.mediaDevices.getUserMedia({ audio: false, video: { width: 1280, height: 720 } })
    .then(function(mediaStream) {
      var video = document.querySelector('video');
      video.className = "";
      console.log(video.className);
      video.srcObject = mediaStream;
      video.onloadedmetadata = function(e) {
        video.play();
      };
    })
    .catch(function(err) { console.log(err.name + ": " + err.message); });    
  });
